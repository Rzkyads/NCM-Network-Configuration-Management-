version: '3.8'

services:
  postgres_db:
    image: postgres:15-alpine
    container_name: ncm_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ncm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ncm_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-ncm_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis_cache:
    image: redis:7-alpine
    container_name: ncm_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: ncm_fastapi
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./backups_storage:/app/backups_storage
    depends_on:
      - postgres_db
      - redis_cache

  celery_worker:
    build: .
    container_name: ncm_worker
    restart: always
    command: celery -A app.services.scheduler.celery_app worker --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
      - ./backups_storage:/app/backups_storage
    depends_on:
      - redis_cache
      - postgres_db

  celery_beat:
    build: .
    container_name: ncm_beat
    restart: always
    command: celery -A app.services.scheduler.celery_app beat --loglevel=info
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis_cache
      - postgres_db

volumes:
  postgres_data:
